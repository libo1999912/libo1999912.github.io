<footer class="simple-footer" style="padding: 0.5rem 0;">
    <div class="footer-content" style="text-align: center; display: flex; flex-direction: column; align-items: center; padding: 0;">
        <div class="welcome-message" style="font-size: clamp(0.8rem, 2vw, 1rem); margin: 0.3rem 0;">
            <i class="fas fa-heart" style="color: #e74c3c;"></i> 欢迎访问{{ site.name | default: site.title }}的个人网站
        </div>
        <div class="social-links" style="display: flex; justify-content: center; gap: 0.8rem; margin: 0.5rem 0;">
            {% if site.author.email %}
                <a href="mailto:{{ site.author.email }}"><i class="fas fa-envelope" style="font-size: clamp(0.8rem, 2vw, 1rem);"></i></a>
            {% endif %}
            {% if site.author.github %}
                <a href="http://github.com/{{ site.author.github }}"><i class="fab fa-github" style="font-size: clamp(0.8rem, 2vw, 1rem);"></i></a>
            {% endif %}
            {% if site.author.linkedin %}
                <a href="https://linkedin.com/in/{{ site.author.linkedin }}"><i class="fab fa-linkedin-in" style="font-size: clamp(0.8rem, 2vw, 1rem);"></i></a>
            {% endif %}
        </div>
        <div class="copyright" style="font-size: clamp(0.75rem, 1.8vw, 0.95rem); margin: 0.5rem 0;">
            &copy; {{ site.time | date: '%Y' }} {{ site.name | default: site.title }}的个人网站 | 使用 <a href="http://jekyllrb.com" rel="nofollow">Jekyll</a> 构建
        </div>
    </div>
</footer>
