{% include base_path %}

<footer class="simple-footer">
    <div class="footer-content">
        <div class="welcome-message">
            <i class="fas fa-heart" style="color: #e74c3c;"></i> 欢迎访问{{ site.name | default: site.title }}的个人网站
        </div>
        <div class="social-links">
            {% if site.author.email %}
                <a href="mailto:{{ site.author.email }}"><i class="fas fa-envelope"></i></a>
            {% endif %}
            {% if site.author.github %}
                <a href="http://github.com/{{ site.author.github }}"><i class="fab fa-github"></i></a>
            {% endif %}
            {% if site.author.linkedin %}
                <a href="https://linkedin.com/in/{{ site.author.linkedin }}"><i class="fab fa-linkedin-in"></i></a>
            {% endif %}
        </div>
        <div class="copyright">
            &copy; {{ site.time | date: '%Y' }} {{ site.name | default: site.title }}的个人网站 | 使用 <a href="http://jekyllrb.com" rel="nofollow">Jekyll</a> 构建
        </div>
    </div>
</footer>
