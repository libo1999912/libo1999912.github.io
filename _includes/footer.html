{% include base_path %}

<footer class="site-footer" style="padding: 8px 0; background-color: #f8f9fa; border-top: 1px solid #eaeaea; margin-top: 20px;">
  <div class="footer-container" style="max-width: 800px; margin: 0 auto; padding: 0 15px;">
    <div class="footer-content" style="text-align: center;">
      
      <!-- 欢迎信息 -->
      <div class="welcome-message" style="font-size: 0.9rem; margin: 5px 0; color: #495057;">
        <i class="fas fa-heart" style="color: #e74c3c; margin-right: 5px;"></i> 
        欢迎访问{{ site.name | default: site.title }}的个人网站
      </div>
      
      <!-- 社交链接 -->
      <div class="social-links" style="display: flex; justify-content: center; gap: 12px; margin: 8px 0;">
        {% if site.author.email %}
          <a href="mailto:{{ site.author.email }}" style="color: #495057; text-decoration: none; font-size: 0.9rem;">
            <i class="fas fa-envelope"></i>
          </a>
        {% endif %}
        {% if site.author.github %}
          <a href="http://github.com/{{ site.author.github }}" style="color: #495057; text-decoration: none; font-size: 0.9rem;">
            <i class="fab fa-github"></i>
          </a>
        {% endif %}
        {% if site.author.linkedin %}
          <a href="https://linkedin.com/in/{{ site.author.linkedin }}" style="color: #495057; text-decoration: none; font-size: 0.9rem;">
            <i class="fab fa-linkedin-in"></i>
          </a>
        {% endif %}
      </div>
      
      <!-- 版权信息 -->
      <div class="copyright" style="font-size: 0.8rem; color: #6c757d; margin: 5px 0;">
        &copy; {{ site.time | date: '%Y' }} {{ site.name | default: site.title }}的个人网站 | 
        使用 <a href="http://jekyllrb.com" rel="nofollow" style="color: #6c757d; text-decoration: underline;">Jekyll</a> 构建
      </div>
      
    </div>
  </div>
</footer>

<!-- 引入Font Awesome图标 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
